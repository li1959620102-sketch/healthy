# Replace the domain and certificate paths before enabling this server block.
upstream ai_health_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name health.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name health.example.com;

    ssl_certificate /etc/letsencrypt/live/health.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://ai_health_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Keep streaming responses (including SSE) from being buffered by nginx.
    location ~* /(chat/query|report/stream|stream)(/|$) {
        proxy_pass http://ai_health_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
